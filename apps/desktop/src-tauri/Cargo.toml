[package]
name = "agentos-desktop"
version = "0.1.0"
description = "AgentOS desktop shell and authenticated local backend bridge"
authors = ["Dandi Setiawan <dandisetiawan.co@gmail.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agentos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
ureq = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
