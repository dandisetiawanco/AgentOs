[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "agentos-backend"
version = "0.1.0"
description = "Local-first autonomous AI desktop agent backend for AgentOS"
readme = "../README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "Dandi Setiawan", email = "dandisetiawan.co@gmail.com" },
]
dependencies = [
  "fastapi>=0.115.8,<1.0.0",
  "uvicorn>=0.34.0,<1.0.0",
  "pydantic>=2.10.6,<3.0.0",
  "pydantic-settings>=2.7.1,<3.0.0",
  "sqlalchemy>=2.0.38,<3.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "alembic>=1.14.1,<2.0.0",
  "httpx>=0.28.1,<1.0.0",
  "langgraph>=0.2.70,<1.0.0",
  "keyring>=25.6.0,<26.0.0",
  "psutil>=6.1.1,<8.0.0",
  "pypdf>=5.3.0,<6.0.0",
  "python-docx>=1.1.2,<2.0.0",
  "openpyxl>=3.1.5,<4.0.0",
  "reportlab>=4.3.1,<5.0.0",
  "playwright==1.49.1",
  "mcp>=1.3.0,<2.0.0",
  "python-multipart>=0.0.20,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9.0.0",
  "pytest-asyncio>=0.25.3,<1.0.0",
  "ruff>=0.9.6,<1.0.0",
  "mypy>=1.15.0,<2.0.0",
  "pip-audit>=2.8.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["agentos", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC"]
ignore = [
  "S101",   # allow assert in tests
  "S104",   # checked explicitly in config validation
  "B008",   # FastAPI Depends in function defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../tests/integration", "../tests/security"]
pythonpath = ["."]
